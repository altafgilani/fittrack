services:
  db:
    image: postgres:16-alpine
    container_name: fittrack-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fittrack
      POSTGRES_PASSWORD: fittrack
      POSTGRES_DB: fittrack
    ports:
      - "5432:5432"
    volumes:
      - fittrack_pgdata:/var/lib/postgresql/data

volumes:
  fittrack_pgdata:
